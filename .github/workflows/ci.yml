# CI workflow for Jarvis — verifies that source builds and tests pass on every
# PR to main and every push to main. No signing, no DMG, no secrets.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-flight CI run for a PR when new commits are pushed. Group by
# workflow + ref so PR runs and `push to main` runs don't cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-14  # Apple Silicon, same as release.yml for parity
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: brew install portaudio

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./...

      - name: Wails build (compile check)
        # No -platform flag — we just want to confirm the full app compiles.
        # No signing, no DMG. Skip if -clean ever causes runner issues.
        run: wails build -skipbindings=false

  # ---------------------------------------------------------------------------
  # Windows compile gate (added after v0.4.0/v0.4.1 shipped with a Windows
  # tree that had never compiled under CGO — the Mac-side
  # `GOOS=windows go build` sanity check runs with CGO_ENABLED=0, which
  # silently skips every `import "C"` file AND hard-fails differently on
  # cgo-only third-party packages. Only a real Windows runner with MinGW
  # compiles internal/screencapture's WASAPI C bridge the way the release
  # workflow does.)
  #
  # Deliberately lean: no Node, no frontend, no wails CLI. The root package
  # embeds frontend/dist, so we build ./internal/... and ./cmd/... only —
  # that covers every CGO surface and every windows-tagged file. The full
  # `wails build` is exercised by release-windows.yml on tag push.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows compile gate (CGO)
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go build (CGO on — compiles the WASAPI C bridge with MinGW)
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: go build ./internal/... ./cmd/...

      - name: Go vet
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: go vet ./internal/... ./cmd/...

      - name: Compile windows-tagged tests (no run)
        # Test binaries are compiled but not executed: the suites have never
        # run on Windows and gating PRs on their pass/fail would block all
        # work on unrelated failures. Compilation alone catches symbol
        # drift between cgo / !cgo / platform files (e.g. the
        # ErrNoPlaybackDevice split).
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          go test -c -o NUL ./internal/screencapture/
          go test -c -o NUL ./internal/paths/
          go test -c -o NUL ./internal/hotkey/
          go test -c -o NUL ./internal/jarvis/...

      - name: Go build arm64 (CGO off — mirrors the release arm64 job)
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOARCH: arm64
        run: go build ./internal/... ./cmd/...
