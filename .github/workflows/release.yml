# Release workflow for Jarvis — builds and publishes a signed DMG on tag push.
#
# Status: SKELETON (TASK-007). Most build steps are commented-out placeholders;
# TASK-027 fills them in once build/scripts/fetch-python.sh,
# build/scripts/build-daemon-venv.sh, build/scripts/fetch-models.sh,
# build/darwin/entitlements.plist, and CHANGELOG.md exist.
#
# The current state runs to completion as a no-op on any v*.*.* tag, which lets
# us validate the workflow trigger + concurrency wiring without producing a DMG.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Prevent two builds of the same tag from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimum permissions: read source. release.yml will need `contents: write` for
# `gh release create` (commented for now — uncomment when TASK-027 enables it).
permissions:
  contents: read
  # contents: write  # TASK-027: required for `gh release create` step below

jobs:
  build-dmg:
    name: Build and publish Jarvis DMG
    runs-on: macos-14  # Apple Silicon runner (arm64)
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

