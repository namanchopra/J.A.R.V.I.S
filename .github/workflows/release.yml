# Release workflow for Jarvis — builds and publishes a signed DMG on tag push.
#
# Triggered by pushing a semver tag (e.g. `v0.1.0`). Produces:
#   - build/bin/Jarvis.app             (Wails-built, codesigned ad-hoc)
#   - Jarvis-<version>.dmg             (drag-to-Applications installer)
#   - GitHub Release with the DMG attached and CHANGELOG.md as release notes
#
# Heavy steps (python-build-standalone fetch, daemon venv build, HF model
# download, Wails build, codesign, DMG creation) all run on a single macos-14
# (Apple Silicon, arm64) runner so the produced binaries are native.
#
# Secrets required (configure under Settings → Secrets and variables → Actions):
#   HF_TOKEN  - Hugging Face read-scope token used by build/scripts/fetch-models.sh
#               to pull microsoft/VibeVoice-Realtime-0.5B and
#               mlx-community/whisper-small.en-mlx. Public repos still benefit
#               from the higher rate limit an authenticated token provides.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Prevent two builds of the same tag from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` is required for `gh release create` to publish the DMG
# and release notes against the just-pushed tag.
permissions:
  contents: write

jobs:
  build-dmg:
    name: Build and publish Jarvis DMG
    runs-on: macos-14  # Apple Silicon runner (arm64)
    # 75 min covers a cold-cache run: ~10 min python-build-standalone +
    # daemon venv, ~15 min HF model pulls (~2.5 GiB), ~10 min Wails build,
    # ~5 min codesign + DMG, plus headroom for runner cold starts.
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # Caches
      # ------------------------------------------------------------------
      # python-build-standalone tarball is ~30 MiB but pinned by tag inside
      # fetch-python.sh, so the script's content is a perfect cache key.
      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: build/python/.fetch-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('build/scripts/fetch-python.sh') }}

      # uv/pip caches keyed on the daemon requirements file so a dependency
      # bump invalidates the cache automatically.
      - name: Cache Python tool caches (uv + pip)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: pytools-${{ runner.os }}-${{ hashFiles('scripts/jarvis-daemon/requirements.txt') }}
          restore-keys: |
            pytools-${{ runner.os }}-

      # Hugging Face models are ~2.5 GiB total. Keyed on the fetch script
      # content so model/version bumps in that script bust the cache.
      - name: Cache bundled AI models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ runner.os }}-${{ hashFiles('build/scripts/fetch-models.sh') }}

      # ------------------------------------------------------------------
      # Build pipeline
      # ------------------------------------------------------------------
      - name: Fetch python-build-standalone (TASK-008)
        timeout-minutes: 10
        run: bash build/scripts/fetch-python.sh

      # pyaudio publishes no cp313 arm64 wheel on macOS, so pip falls back to
      # compiling from source — which needs portaudio's headers. Pre-install
      # the C library so `pip install pyaudio` finds <portaudio.h>.
      - name: Install portaudio (pyaudio build dep)
        run: brew install portaudio

      - name: Build relocatable daemon venv (TASK-009)
        timeout-minutes: 20
        run: bash build/scripts/build-daemon-venv.sh

      # fetch-models.sh shells out to `huggingface-cli`. macos-14 runners
      # ship a PEP 668 "externally managed" system Python, so we can't use
      # `pip install`. Homebrew has a first-party formula — use that.
      - name: Install huggingface-cli
        run: brew install huggingface-cli

      # HF_TOKEN must be configured in repo Actions secrets
      # (Settings → Secrets and variables → Actions → New repository secret).
      # A read-scope token is sufficient.
      - name: Fetch VibeVoice + Whisper models (TASK-013)
        timeout-minutes: 30
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash build/scripts/fetch-models.sh

      - name: Build Jarvis.app (TASK-027)
        timeout-minutes: 20
        run: wails build -platform darwin/arm64 -clean

      # Wails v2's wails.json `postBuildHooks` field is silently ignored
      # (it's not part of the v2 schema, despite the docs implying so).
      # Invoke post-build.sh explicitly so the daemon venv + bundled models
      # actually end up inside Jarvis.app/Contents/Resources/ -- without this
      # the DMG ships as a ~10MB empty shell with no Python runtime.
      - name: Bundle daemon venv + models into Jarvis.app
        timeout-minutes: 10
        run: bash build/scripts/post-build.sh

      - name: Codesign Jarvis.app (ad-hoc, hardened runtime)
        timeout-minutes: 10
        run: |
          codesign --force --deep \
            --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign - \
            build/bin/Jarvis.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        timeout-minutes: 10
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Jarvis" \
            --window-size 600 400 \
            --icon-size 100 \
            "Jarvis-${VERSION}.dmg" \
            build/bin/Jarvis.app

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "Jarvis-${VERSION}.dmg" \
            --title "Jarvis ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
