# Release workflow for Jarvis — builds and publishes a signed DMG on tag push.
#
# Triggered by pushing a semver tag (e.g. `v0.1.0`). Produces:
#   - build/bin/Jarvis.app             (Wails-built, Developer ID signed + notarized)
#   - Jarvis-<version>.dmg             (drag-to-Applications installer, notarized)
#   - GitHub Release with the DMG attached and CHANGELOG.md as release notes
#
# Heavy steps (uv fetch, HF voice-preset download, Wails build, codesign,
# DMG creation) all run on a single macos-14 (Apple Silicon, arm64) runner so
# the produced binaries are native.
#
# v0.2.0 (TASK-013): the daemon venv is no longer built in CI. Instead we
# bundle the `uv` binary inside Jarvis.app via post-build.sh; the v0.2.0
# setup orchestrator (`scripts/setup/install-daemon.sh`) materializes the
# Python interpreter + venv into ~/Library/Application Support/Jarvis/ on
# first launch. This trims ~140MB off the DMG and ~7min off cold CI.
#
# Secrets required (configure under Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE          - Base64-encoded .p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD - Password for the .p12 file
#   APPLE_SIGNING_IDENTITY     - e.g. "Developer ID Application: Your Name (TEAM_ID)"
#   APPLE_ID                   - Apple ID email for notarytool
#   APPLE_PASSWORD             - App-specific password for notarytool
#   TEAM_ID                    - Apple Developer Team ID
#   KEYCHAIN_PASSWORD          - Arbitrary password for the temporary CI keychain
#   HF_TOKEN                   - Hugging Face read-scope token for voice-preset download

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Prevent two builds of the same tag from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` is required for `gh release create` to publish the DMG
# and release notes against the just-pushed tag.
permissions:
  contents: write

jobs:
  build-dmg:
    name: Build and publish Jarvis DMG
    runs-on: macos-14  # Apple Silicon runner (arm64)
    # 45 min covers a cold-cache run after the v0.2.0 strip (TASK-013):
    # ~30s uv fetch (~20MB tarball), ~3 min HF voice-preset pull, ~10 min
    # Wails build, ~5 min codesign + DMG, ~30 min notarization wait, plus
    # headroom for runner cold starts. Was 75 min before TASK-013 because
    # python-build-standalone + daemon-venv build added ~7 min and the full
    # ~2.5 GiB model pull added ~15 min — both now deferred to first-launch
    # setup on the user's machine.
    timeout-minutes: 45

    # `secrets.X` can't be referenced in step-level `if:` directly (GHA
    # security restriction), so we materialise the flag once at job level
    # via env, then gate Developer ID + notarytool steps on `env.HAS_APPLE_CERT`.
    # When unset, the workflow falls through to post-build.sh's ad-hoc
    # signature and publishes an unnotarized DMG (right-click → Open
    # workaround). When set, the same workflow upgrades to the full
    # signed + notarized + stapled path.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # Caches
      # ------------------------------------------------------------------
      # uv binary tarball is ~20 MiB but pinned by tag inside fetch-uv.sh,
      # so the script's content is a perfect cache key. We cache the whole
      # build/uv tree (extracted binary + .fetch-cache subdir with tarball
      # and sha sidecar) so re-runs at the same uv tag are a no-op via
      # fetch-uv.sh's idempotency stamp.
      - name: Cache uv binary
        uses: actions/cache@v4
        with:
          path: build/uv
          key: uv-${{ runner.os }}-${{ hashFiles('build/scripts/fetch-uv.sh') }}

      # Hugging Face voice preset is ~4 MiB on disk (LIGHT_BUNDLE=1 skips
      # the ~2.4 GiB model weights, which the daemon fetches on first launch).
      # Keyed on the fetch script content so preset/version bumps in that
      # script bust the cache.
      - name: Cache bundled AI models
        uses: actions/cache@v4
        with:
          path: build/models
          key: models-${{ runner.os }}-${{ hashFiles('build/scripts/fetch-models.sh') }}

      # ------------------------------------------------------------------
      # Build pipeline
      # ------------------------------------------------------------------
      # pyaudio publishes no cp313 arm64 wheel on macOS, so pip falls back to
      # compiling from source on the user's machine during first-launch setup
      # — which needs portaudio's headers + dylib. We still install portaudio
      # here at build time because post-build.sh (TASK-005) bundles
      # libportaudio.dylib into Jarvis.app/Contents/Resources/ so the
      # bundled environment can build pyaudio without a host Homebrew install.
      - name: Install portaudio (pyaudio build dep)
        run: brew install portaudio

      # Fetches the pinned uv release (~20MB) to build/uv/uv. post-build.sh
      # then copies that binary + scripts/setup/install-daemon.sh into
      # Jarvis.app/Contents/Resources/ so the orchestrator can materialize
      # the daemon venv on first launch (TASK-005).
      - name: Fetch uv binary
        timeout-minutes: 5
        run: bash build/scripts/fetch-uv.sh

      # fetch-models.sh shells out to `huggingface-cli`. macos-14 runners
      # ship a PEP 668 "externally managed" system Python, so we can't use
      # `pip install`. Homebrew has a first-party formula — use that.
      - name: Install huggingface-cli
        run: brew install huggingface-cli

      # HF_TOKEN must be configured in repo Actions secrets
      # (Settings → Secrets and variables → Actions → New repository secret).
      # A read-scope token is sufficient.
      # LIGHT_BUNDLE=1 skips the 2.4 GB of VibeVoice + Whisper model weights
      # and bundles only the 4 MB voice preset. We need this to keep the DMG
      # under GitHub's 2 GiB release-asset hard limit. The daemon will fetch
      # the model weights to ~/.cache/huggingface on first launch via the
      # same HuggingFace mechanism Kokoro already uses.
      - name: Fetch VibeVoice voice preset (light bundle)
        timeout-minutes: 5
        env:
          LIGHT_BUNDLE: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash build/scripts/fetch-models.sh

      - name: Build Jarvis.app (TASK-027)
        timeout-minutes: 20
        run: wails build -platform darwin/arm64 -clean

      # Wails v2's wails.json `postBuildHooks` field is silently ignored
      # (it's not part of the v2 schema, despite the docs implying so).
      # Invoke post-build.sh explicitly so the uv binary, setup orchestrator
      # (install-daemon.sh), libportaudio.dylib, and bundled voice preset end
      # up inside Jarvis.app/Contents/Resources/ -- without this the DMG
      # ships as a ~10MB empty shell with no first-launch setup payload.
      # (TASK-005 rewired this step from python+venv bundling to uv+setup.)
      - name: Bundle setup payload (uv + install-daemon.sh + voice preset) into Jarvis.app
        timeout-minutes: 10
        run: bash build/scripts/post-build.sh

      # ------------------------------------------------------------------
      # Code Signing & Notarization
      # ------------------------------------------------------------------
      # The four Developer ID signing + notarization steps below all skip
      # when APPLE_CERTIFICATE isn't configured as a repo secret. In that
      # case the ad-hoc signature applied by post-build.sh remains in place
      # and the DMG ships unnotarized (users will need to right-click → Open
      # the first time, exactly as v0.1.0–v0.1.2 did). When the cert IS set,
      # the workflow re-signs the bundle with Developer ID, hardens the
      # runtime, and submits to notarytool for a stapled release.
      - name: Import Apple Developer ID certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode the .p12 certificate from base64
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the certificate into the keychain
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain without UI prompt
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add the temporary keychain to the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Codesign Jarvis.app (Developer ID, hardened runtime)
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        timeout-minutes: 10
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Sign all nested frameworks/dylibs first (deep signing)
          find build/bin/Jarvis.app -type f \( -name "*.dylib" -o -name "*.so" \) -exec \
            codesign --force --options runtime \
              --entitlements build/darwin/entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" \
              --timestamp {} \;

          # Sign extensionless Mach-O binaries bundled into Resources/.
          # The uv binary (TASK-005) is signed by astral-sh with their own
          # Developer ID, which fails notarization for our team -- we have
          # to re-sign it under our identity with hardened runtime + a
          # secure timestamp. Iterate over every Mach-O under Resources/
          # so future bundled binaries are covered without another patch.
          while IFS= read -r BIN; do
            if file "$BIN" | grep -q 'Mach-O.*executable'; then
              echo "Re-signing Mach-O: $BIN"
              codesign --force --options runtime \
                --entitlements build/darwin/entitlements.plist \
                --sign "$APPLE_SIGNING_IDENTITY" \
                --timestamp \
                "$BIN"
            fi
          done < <(find build/bin/Jarvis.app/Contents/Resources -type f ! -name "*.dylib" ! -name "*.so")

          # Sign the main bundle
          codesign --force --deep \
            --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            build/bin/Jarvis.app

          # Verify the signature
          codesign --verify --deep --strict --verbose=2 build/bin/Jarvis.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        timeout-minutes: 10
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          create-dmg \
            --volname "Jarvis" \
            --window-size 600 400 \
            --icon-size 100 \
            "Jarvis-${VERSION}.dmg" \
            build/bin/Jarvis.app

      - name: Codesign DMG
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          codesign --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "Jarvis-${VERSION}.dmg"

      - name: Notarize DMG
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="Jarvis-${VERSION}.dmg"

          # Submit for notarization (no --wait so we own the submission ID).
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --output-format json)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "Submission ID: $SUBMISSION_ID"

          # Poll status until Accepted or Invalid.
          xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID"

          # ALWAYS fetch and print the full Apple log -- on Invalid this is the
          # only way to see why notarization failed.
          echo "::group::Notarization log"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID"
          echo "::endgroup::"

          # Re-fetch info and gate on Accepted status.
          INFO=$(xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --output-format json)
          STATUS=$(echo "$INFO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          echo "Final status: $STATUS"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            exit 1
          fi

          # Staple the notarization ticket to the DMG
          xcrun stapler staple "$DMG_PATH"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Publish GitHub Release
        # The built-in GITHUB_TOKEN with `permissions: contents: write` (declared
        # at the workflow level) has everything `gh release create` needs.
        # The previous GH_PAT secret was missing the right scope and the
        # publish step kept dying at HTTP 403.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "Jarvis-${VERSION}.dmg" \
            --title "Jarvis ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
