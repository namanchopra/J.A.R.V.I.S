# TASK-060: winget DefaultLocale manifest for Jarvis (en-US).
#
# Surfaces the human-readable metadata `winget show Namanchopra.Jarvis`
# displays. Because the Version manifest declares DefaultLocale: en-US, this
# file MUST exist and use ManifestType: defaultLocale (not "locale" — that
# type is reserved for additional, non-default locales).
#
# Acceptance criteria covered (TASK-060):
#   - `winget install Namanchopra.Jarvis` works: the DefaultLocale entry
#     here matches the one declared in Namanchopra.Jarvis.yaml.
#   - Manifest validates: every required key for v1.6.0 defaultLocale is
#     present (PackageIdentifier, PackageVersion, PackageLocale, Publisher,
#     PackageName, License, ShortDescription, ManifestType, ManifestVersion).
#   - Failure case: Microsoft reviewers occasionally bounce manifests for
#     "ShortDescription too long" (>256 chars) or "Tags not lower-kebab".
#     Both constraints are honoured below.
#
PackageIdentifier: Namanchopra.Jarvis
PackageVersion: 0.4.0
PackageLocale: en-US

Publisher: namanchopra
PublisherUrl: https://github.com/namanchopra
PublisherSupportUrl: https://github.com/namanchopra/J.A.R.V.I.S/issues
PrivacyUrl: https://github.com/namanchopra/J.A.R.V.I.S/blob/main/README.md#privacy

